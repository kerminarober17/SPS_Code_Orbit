<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Challenges - SPS Code Orbit</title>
  <link rel="stylesheet" href="../css/global.css?v=2.0">
  <link rel="stylesheet" href="../css/components.css?v=2.0">
  <link rel="stylesheet" href="../css/responsive.css?v=1.2">
  <link rel="stylesheet" href="../css/dashboard.css?v=2.0">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    .challenge-card {
      background: rgba(16, 23, 42, 0.65);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: var(--radius-xl);
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      transition: border-color 0.15s ease;
    }
    .challenge-card.is-selected {
      border-color: rgba(59, 130, 246, 0.55);
    }
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.3rem 0.7rem;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 700;
      white-space: nowrap;
    }
    .st-not_submitted { background: rgba(148,163,184,0.15); color: #94A3B8; border: 1px solid rgba(148,163,184,0.3); }
    .st-pending { background: rgba(245,158,11,0.15); color: #F59E0B; border: 1px solid rgba(245,158,11,0.3); }
    .st-approved { background: rgba(16,185,129,0.15); color: #10B981; border: 1px solid rgba(16,185,129,0.3); }
    .st-rejected { background: rgba(239,68,68,0.15); color: #F87171; border: 1px solid rgba(239,68,68,0.3); }
    .filter-chip {
      padding: 0.4rem 0.9rem;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.12);
      background: transparent;
      color: var(--text-secondary);
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
    }
    .filter-chip.active {
      background: rgba(59,130,246,0.2);
      color: #60A5FA;
      border-color: rgba(59,130,246,0.45);
    }
    .detail-panel {
      background: rgba(16, 23, 42, 0.85);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: var(--radius-xl);
      padding: 1.75rem;
    }
    .feedback-box {
      background: rgba(59,130,246,0.08);
      border-left: 3px solid #3B82F6;
      padding: 0.85rem 1rem;
      border-radius: 0 var(--radius-md) var(--radius-md) 0;
      font-size: 0.9rem;
    }
    .upload-zone {
      border: 1px dashed rgba(255,255,255,0.22);
      border-radius: var(--radius-lg);
      padding: 1.35rem 1.25rem;
      text-align: center;
      background: rgba(255,255,255,0.03);
      transition: border-color 0.15s ease, background 0.15s ease;
    }
    .upload-zone.has-file {
      border-style: solid;
      border-color: rgba(59,130,246,0.4);
      background: rgba(59,130,246,0.06);
    }
    .upload-zone-icon {
      font-size: 1.75rem;
      margin-bottom: 0.5rem;
      line-height: 1;
    }
    .upload-zone-title {
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--text-main);
      margin: 0 0 0.25rem;
    }
    .upload-zone-hint {
      margin: 0 0 1rem;
      font-size: 0.8rem;
      color: var(--text-secondary);
      line-height: 1.45;
    }
    .file-input-native {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    .file-pick-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
      padding: 0.55rem 1.15rem;
      border-radius: 999px;
      border: 1px solid rgba(59,130,246,0.45);
      background: rgba(59,130,246,0.18);
      color: #93C5FD;
      font-size: 0.875rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease;
    }
    .file-pick-btn:hover {
      background: rgba(59,130,246,0.28);
      border-color: rgba(59,130,246,0.65);
    }
    .file-pick-btn:focus-visible {
      outline: 2px solid #60A5FA;
      outline-offset: 2px;
    }
    .file-meta {
      margin-top: 0.9rem;
      padding: 0.65rem 0.85rem;
      border-radius: 10px;
      background: rgba(0,0,0,0.28);
      font-size: 0.85rem;
      color: var(--text-main);
      text-align: left;
      display: none;
    }
    .file-meta.visible { display: block; }
    .file-meta-name { font-weight: 700; word-break: break-all; }
    .file-meta-size { color: var(--text-secondary); font-size: 0.8rem; margin-top: 0.2rem; }
    .file-preview {
      margin-top: 0.65rem;
      max-width: 160px;
      max-height: 120px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.12);
      display: none;
      object-fit: contain;
    }
    .file-preview.visible { display: block; }
    .ch-loading {
      color: var(--text-secondary);
      padding: 2.5rem 1.5rem;
      text-align: center;
    }
    .ch-loading-spinner {
      display: inline-block;
      width: 1.5rem;
      height: 1.5rem;
      border: 2px solid rgba(255,255,255,0.15);
      border-top-color: #60A5FA;
      border-radius: 50%;
      animation: ch-spin 0.7s linear infinite;
      margin-bottom: 0.75rem;
    }
    @keyframes ch-spin { to { transform: rotate(360deg); } }
    .ch-error-card {
      text-align: center;
      color: #F87171;
    }
    .ch-error-card .btn { margin-top: 0.85rem; }
    @media (max-width: 768px) {
      .ch-layout { flex-direction: column !important; }
    }
  </style>
</head>
<body style="background: #070A14;">
  <div class="space-universe-backdrop" aria-hidden="true">
    <div class="starfield-layer"></div>
    <div class="starfield-layer-dense"></div>
    <div class="nebula-swirl-container">
      <div class="nebula-cloud nebula-blue"></div>
      <div class="nebula-cloud nebula-purple"></div>
    </div>
  </div>

  <div id="app-shell" class="dashboard-layout">
    <aside id="sidebar-root"></aside>
    <div class="dashboard-main">
      <header id="header-root"></header>
      <main class="dashboard-content" style="padding: 1.5rem;">
        <div style="margin-bottom: 1.25rem;">
          <h1 style="font-size: 1.5rem; font-weight: 800; color: var(--text-main); margin: 0 0 0.35rem;">
            🚀 <span data-i18n="challenges.title">Challenges</span>
          </h1>
          <p style="color: var(--text-secondary); margin: 0; font-size: 0.95rem;" data-i18n="challenges.subtitle">
            Build the requested project, upload your work, and get teacher feedback.
          </p>
        </div>

        <div style="display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1.25rem;" id="filter-bar">
          <button type="button" class="filter-chip active" data-filter="all">All</button>
          <button type="button" class="filter-chip" data-filter="available">Available</button>
          <button type="button" class="filter-chip" data-filter="pending">Pending</button>
          <button type="button" class="filter-chip" data-filter="approved">Approved</button>
          <button type="button" class="filter-chip" data-filter="needs_resubmission">Needs Resubmission</button>
        </div>

        <div class="ch-layout" style="display: flex; gap: 1.25rem; align-items: flex-start;">
          <div style="flex: 1; min-width: 0;">
            <div id="challenges-list" style="display: flex; flex-direction: column; gap: 1rem;">
              <div class="ch-loading">
                <div class="ch-loading-spinner" aria-hidden="true"></div>
                <div>Loading challenges...</div>
              </div>
            </div>
          </div>
          <div id="detail-root" style="flex: 1.1; min-width: 280px; display: none;"></div>
        </div>
      </main>
    </div>
  </div>

  <script src="../js/session.js"></script>
  <script src="../js/i18n.js"></script>
  <script>
    window.addEventListener('languagechange', function () {
      if (window.i18n && window.i18n.applyTranslations) window.i18n.applyTranslations(document);
      if (typeof loadChallenges === 'function') loadChallenges();
      else if (typeof fetchChallenges === 'function') fetchChallenges();
    });
  </script>
  <script src="../js/components.js"></script>
  <script src="../js/theme.js"></script>
  <script>
    (function () {
      'use strict';

      let currentFilter = 'all';
      let challengesCache = [];
      let selectedId = null;
      let pageInitialized = false;
      let listLoading = false;
      let detailLoading = false;
      let listRequestId = 0;
      let detailRequestId = 0;

      function statusLabel(s) {
        const map = {
          not_submitted: 'Not Submitted',
          pending: 'Pending Review',
          approved: 'Approved',
          rejected: 'Rejected — Resubmission Available',
        };
        return map[s] || s;
      }

      function escapeHtml(str) {
        if (str == null) return '';
        return String(str).replace(/[&<>"']/g, c =>
          ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])
        );
      }

      function formatBytes(n) {
        n = Number(n) || 0;
        if (n < 1024) return n + ' B';
        if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
        return (n / (1024 * 1024)).toFixed(1) + ' MB';
      }

      function getCsrfToken() {
        if (window.session && window.session.csrfToken) return window.session.csrfToken;
        if (window.session && window.session.csrf_token) return window.session.csrf_token;
        return '';
      }

      function showListLoading() {
        const list = document.getElementById('challenges-list');
        if (!list) return;
        list.innerHTML = `
          <div class="ch-loading">
            <div class="ch-loading-spinner" aria-hidden="true"></div>
            <div>Loading challenges...</div>
          </div>`;
      }

      function showListError(message, isAuth) {
        const list = document.getElementById('challenges-list');
        if (!list) return;
        const safe = escapeHtml(message || 'Unable to load challenges.');
        list.innerHTML = `
          <div class="challenge-card ch-error-card">
            <div style="font-weight:700;font-size:1.05rem;">${isAuth ? 'Session expired' : 'Something went wrong'}</div>
            <div style="margin-top:0.4rem;color:var(--text-secondary);font-size:0.9rem;">${safe}</div>
            ${isAuth
              ? `<button type="button" class="btn btn-primary btn-pill" onclick="window.location.href='/login.html'">Go to Login</button>`
              : `<button type="button" class="btn btn-primary btn-pill" id="btn-retry-challenges">Try Again</button>`
            }
          </div>`;
        const retry = document.getElementById('btn-retry-challenges');
        if (retry) {
          retry.addEventListener('click', () => loadChallenges());
        }
        document.getElementById('detail-root').style.display = 'none';
      }

      function renderChallengeList(items) {
        const list = document.getElementById('challenges-list');
        if (!list) return;

        if (!items.length) {
          list.innerHTML = `
            <div class="challenge-card" style="text-align:center;color:var(--text-secondary);">
              <div style="font-weight:700;font-size:1.05rem;">No challenges available</div>
              <div style="margin-top:0.35rem;font-size:0.9rem;">Check back later for new missions.</div>
            </div>`;
          document.getElementById('detail-root').style.display = 'none';
          return;
        }

        list.innerHTML = items.map(ch => {
          const selected = selectedId === ch.id ? ' is-selected' : '';
          return `
          <div class="challenge-card${selected}" style="cursor:pointer;" data-challenge-id="${escapeHtml(ch.id)}" role="button" tabindex="0">
            <div style="display:flex;justify-content:space-between;gap:0.75rem;align-items:flex-start;">
              <div>
                <div style="font-weight:800;font-size:1.05rem;color:var(--text-main);">${escapeHtml(ch.title)}</div>
                <div style="font-size:0.85rem;color:var(--text-secondary);margin-top:0.25rem;">${escapeHtml(ch.description || '')}</div>
              </div>
              <span class="status-pill st-${escapeHtml(ch.submission_status)}">${escapeHtml(statusLabel(ch.submission_status))}</span>
            </div>
            <div style="display:flex;flex-wrap:wrap;gap:0.5rem;font-size:0.78rem;color:var(--text-secondary);">
              ${ch.difficulty ? `<span>⚡ ${escapeHtml(ch.difficulty)}</span>` : ''}
              ${ch.course_title ? `<span>📚 ${escapeHtml(ch.course_title)}</span>` : ''}
              ${ch.deadline ? `<span>📅 ${escapeHtml(String(ch.deadline).substring(0, 16))}</span>` : ''}
              ${ch.xp_reward ? `<span>⭐ +${escapeHtml(ch.xp_reward)} XP</span>` : ''}
            </div>
          </div>`;
        }).join('');

        list.querySelectorAll('[data-challenge-id]').forEach(el => {
          const id = el.getAttribute('data-challenge-id');
          el.addEventListener('click', () => openChallenge(id));
          el.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
              e.preventDefault();
              openChallenge(id);
            }
          });
        });
      }

      async function loadChallenges() {
        if (listLoading) return;
        listLoading = true;
        const requestId = ++listRequestId;
        const list = document.getElementById('challenges-list');

        // Only show full loading placeholder when list is empty / first load
        if (!challengesCache.length || !list.querySelector('.challenge-card')) {
          showListLoading();
        }

        try {
          const url = '/api/challenges/list.php?filter=' + encodeURIComponent(currentFilter) + '&_t=' + Date.now();
          const res = await fetch(url, { credentials: 'same-origin', cache: 'no-store' });
          let json = null;
          try {
            json = await res.json();
          } catch (_) {
            json = null;
          }

          if (requestId !== listRequestId) return;

          if (res.status === 401) {
            showListError('Please sign in again to view challenges.', true);
            return;
          }
          if (res.status === 403) {
            showListError('You do not have permission to view challenges.', false);
            return;
          }
          if (!res.ok || !json || !json.success) {
            const msg = (json && (json.message || json.error)) || ('Unable to load challenges (HTTP ' + res.status + ').');
            showListError(msg, false);
            return;
          }

          const rows = (json.data && Array.isArray(json.data.challenges))
            ? json.data.challenges
            : [];
          const seen = Object.create(null);
          challengesCache = rows.filter(function (c) {
            const id = c && c.id != null ? String(c.id) : '';
            if (!id || seen[id]) return false;
            seen[id] = true;
            return true;
          });
          renderChallengeList(challengesCache);

          // Refresh detail status badges only — do NOT re-enter openChallenge from list load
          // (that caused the infinite load → render → open → load loop)
        } catch (e) {
          if (requestId !== listRequestId) return;
          showListError(e.message || 'Network error while loading challenges.', false);
        } finally {
          if (requestId === listRequestId) {
            listLoading = false;
          }
        }
      }

      function buildUploadBlock(ch, status) {
        const maxZip = ch.max_zip_mb || 10;
        const maxImg = ch.max_image_mb || 5;
        return `
          <div style="margin-top:1.25rem;">
            <h3 style="margin:0 0 0.5rem;font-size:1rem;">Submit Project</h3>
            <div class="upload-zone" id="upload-zone">
              <div class="upload-zone-icon" aria-hidden="true">📎</div>
              <p class="upload-zone-title">Choose project file</p>
              <p class="upload-zone-hint">
                ZIP up to ${escapeHtml(maxZip)} MB, or JPG / JPEG / PNG / WEBP up to ${escapeHtml(maxImg)} MB.
              </p>
              <input type="file" id="challenge-file" class="file-input-native"
                     accept=".zip,image/jpeg,image/png,image/webp,.jpg,.jpeg,.png,.webp"
                     aria-label="Choose project file">
              <button type="button" class="file-pick-btn" id="btn-pick-file">Choose File</button>
              <div class="file-meta" id="file-meta">
                <div class="file-meta-name" id="file-meta-name"></div>
                <div class="file-meta-size" id="file-meta-size"></div>
                <img class="file-preview" id="file-preview" alt="Selected image preview">
              </div>
              <div id="upload-msg" style="margin-top:0.75rem;font-size:0.85rem;" role="status"></div>
              <button type="button" class="btn btn-primary btn-pill" style="margin-top:0.85rem;" id="btn-submit-challenge">
                ${status === 'rejected' ? 'Resubmit' : 'Submit'}
              </button>
            </div>
          </div>`;
      }

      function wireUploadControls(challengeId, ch) {
        const input = document.getElementById('challenge-file');
        const pickBtn = document.getElementById('btn-pick-file');
        const zone = document.getElementById('upload-zone');
        const meta = document.getElementById('file-meta');
        const metaName = document.getElementById('file-meta-name');
        const metaSize = document.getElementById('file-meta-size');
        const preview = document.getElementById('file-preview');
        const msg = document.getElementById('upload-msg');
        const submitBtn = document.getElementById('btn-submit-challenge');

        if (!input || !pickBtn) return;

        pickBtn.addEventListener('click', (e) => {
          e.preventDefault();
          e.stopPropagation();
          input.click();
        });

        input.addEventListener('change', () => {
          msg.textContent = '';
          const file = input.files && input.files[0];
          if (!file) {
            zone.classList.remove('has-file');
            meta.classList.remove('visible');
            preview.classList.remove('visible');
            preview.removeAttribute('src');
            return;
          }

          const maxZip = (ch.max_zip_mb || 10) * 1024 * 1024;
          const maxImg = (ch.max_image_mb || 5) * 1024 * 1024;
          const name = file.name || 'file';
          const lower = name.toLowerCase();
          const isZip = lower.endsWith('.zip') || file.type === 'application/zip' || file.type === 'application/x-zip-compressed';
          const isImage = /^image\/(jpeg|png|webp)$/i.test(file.type) ||
            /\.(jpe?g|png|webp)$/i.test(lower);

          if (!isZip && !isImage) {
            msg.style.color = '#F87171';
            msg.textContent = 'Only ZIP archives and images (JPG, PNG, WEBP) are allowed.';
            input.value = '';
            zone.classList.remove('has-file');
            meta.classList.remove('visible');
            preview.classList.remove('visible');
            return;
          }
          if (isZip && file.size > maxZip) {
            msg.style.color = '#F87171';
            msg.textContent = 'ZIP files must be ' + (ch.max_zip_mb || 10) + ' MB or smaller.';
            input.value = '';
            zone.classList.remove('has-file');
            meta.classList.remove('visible');
            return;
          }
          if (isImage && file.size > maxImg) {
            msg.style.color = '#F87171';
            msg.textContent = 'Images must be ' + (ch.max_image_mb || 5) + ' MB or smaller.';
            input.value = '';
            zone.classList.remove('has-file');
            meta.classList.remove('visible');
            return;
          }

          zone.classList.add('has-file');
          meta.classList.add('visible');
          metaName.textContent = name;
          metaSize.textContent = formatBytes(file.size);

          if (isImage) {
            const url = URL.createObjectURL(file);
            preview.src = url;
            preview.classList.add('visible');
            preview.onload = () => URL.revokeObjectURL(url);
          } else {
            preview.classList.remove('visible');
            preview.removeAttribute('src');
          }
        });

        if (submitBtn) {
          submitBtn.addEventListener('click', (e) => {
            e.preventDefault();
            submitChallenge(challengeId);
          });
        }
      }

      async function openChallenge(id) {
        if (!id || detailLoading) return;
        selectedId = id;
        detailLoading = true;
        const requestId = ++detailRequestId;
        const root = document.getElementById('detail-root');
        root.style.display = 'block';
        root.innerHTML = '<div class="detail-panel" style="color:var(--text-secondary);"><div class="ch-loading-spinner" style="margin:0 auto 0.75rem;"></div>Loading...</div>';

        // Highlight selection in list without full reload
        document.querySelectorAll('#challenges-list .challenge-card').forEach(card => {
          const cid = card.getAttribute('data-challenge-id');
          card.classList.toggle('is-selected', cid === id);
        });

        try {
          const url = '/api/challenges/get.php?id=' + encodeURIComponent(id) + '&_t=' + Date.now();
          const res = await fetch(url, { credentials: 'same-origin', cache: 'no-store' });
          let json = null;
          try {
            json = await res.json();
          } catch (_) {
            json = null;
          }

          if (requestId !== detailRequestId) return;

          if (res.status === 401) {
            root.innerHTML = `<div class="detail-panel" style="color:#F87171;">Session expired. <a href="/login.html" style="color:#93C5FD;">Sign in again</a>.</div>`;
            return;
          }
          if (!res.ok || !json || !json.success) {
            const msg = (json && (json.message || json.error)) || 'Failed to load challenge.';
            root.innerHTML = `<div class="detail-panel" style="color:#F87171;">${escapeHtml(msg)}</div>`;
            return;
          }

          const ch = json.data.challenge;
          const sub = json.data.submission;
          const canSubmit = json.data.can_submit;
          const status = json.data.submission_status;

          let subBlock = '';
          if (sub) {
            subBlock = `
              <div style="margin-top:1rem;">
                <div class="status-pill st-${escapeHtml(status)}" style="margin-bottom:0.75rem;">${escapeHtml(statusLabel(status))}</div>
                <div style="font-size:0.85rem;color:var(--text-secondary);">
                  Submitted: ${escapeHtml(String(sub.submitted_at || '').substring(0, 16))}
                  · File: ${escapeHtml(sub.file_original_name)} (${escapeHtml(sub.file_type)})
                </div>
                ${sub.feedback ? `<div class="feedback-box" style="margin-top:0.75rem;"><strong>Reviewer Feedback</strong><br>${escapeHtml(sub.feedback)}</div>` : ''}
                ${sub.score != null ? `<div style="margin-top:0.5rem;font-size:0.85rem;">Score: ${escapeHtml(sub.score)}</div>` : ''}
                <a class="btn btn-sm btn-outline" style="margin-top:0.75rem;text-decoration:none;display:inline-block;"
                   href="/api/challenges/download.php?submission_id=${encodeURIComponent(sub.id)}">Download my file</a>
              </div>`;
          }

          let uploadBlock = '';
          if (canSubmit) {
            uploadBlock = buildUploadBlock(ch, status);
          } else if (status === 'pending') {
            uploadBlock = `<div style="margin-top:1rem;padding:0.85rem;border-radius:12px;background:rgba(245,158,11,0.1);color:#F59E0B;font-size:0.9rem;">
              Submission received. Waiting for teacher or admin review.
            </div>`;
          } else if (ch.deadline_passed && status === 'not_submitted') {
            uploadBlock = `<div style="margin-top:1rem;color:#F87171;font-size:0.9rem;">Deadline has passed. New submissions are closed.</div>`;
          }

          root.innerHTML = `
            <div class="detail-panel">
              <div style="font-weight:800;font-size:1.2rem;color:var(--text-main);">${escapeHtml(ch.title)}</div>
              <div style="color:var(--text-secondary);margin:0.5rem 0 1rem;font-size:0.9rem;">${escapeHtml(ch.description || '')}</div>
              <div style="font-size:0.8rem;color:var(--text-secondary);margin-bottom:1rem;">
                ${ch.difficulty ? '⚡ ' + escapeHtml(ch.difficulty) + ' · ' : ''}
                ${ch.course_title ? '📚 ' + escapeHtml(ch.course_title) + ' · ' : ''}
                ${ch.deadline ? '📅 ' + escapeHtml(String(ch.deadline).substring(0, 16)) : 'No deadline'}
              </div>
              <h3 style="margin:0 0 0.5rem;font-size:0.95rem;">Instructions</h3>
              <div style="white-space:pre-wrap;font-size:0.9rem;line-height:1.55;color:var(--text-main);background:rgba(0,0,0,0.25);padding:1rem;border-radius:12px;">${escapeHtml(ch.instructions)}</div>
              ${subBlock}
              ${uploadBlock}
            </div>`;

          if (canSubmit) {
            wireUploadControls(ch.id, ch);
          }

          // Soft-refresh list statuses once after detail load (no openChallenge recursion)
          softRefreshListStatuses();
        } catch (e) {
          if (requestId !== detailRequestId) return;
          root.innerHTML = `<div class="detail-panel" style="color:#F87171;">${escapeHtml(e.message || 'Failed to load challenge.')}</div>`;
        } finally {
          if (requestId === detailRequestId) {
            detailLoading = false;
          }
        }
      }

      /** Update status pills in the list from cache without full API + openChallenge cycle */
      function softRefreshListStatuses() {
        // Re-fetch list once in background to sync status, but never call openChallenge from it
        if (listLoading) return;
        listLoading = true;
        const requestId = ++listRequestId;
        fetch('/api/challenges/list.php?filter=' + encodeURIComponent(currentFilter) + '&_t=' + Date.now(), {
          credentials: 'same-origin',
          cache: 'no-store'
        })
          .then(r => r.json().then(j => ({ ok: r.ok, status: r.status, j })))
          .then(({ ok, status, j }) => {
            if (requestId !== listRequestId) return;
            if (!ok || !j || !j.success) return;
            const rows = (j.data && Array.isArray(j.data.challenges)) ? j.data.challenges : [];
            challengesCache = rows;
            renderChallengeList(challengesCache);
          })
          .catch(() => {})
          .finally(() => {
            if (requestId === listRequestId) listLoading = false;
          });
      }

      async function submitChallenge(challengeId) {
        const input = document.getElementById('challenge-file');
        const msg = document.getElementById('upload-msg');
        const btn = document.getElementById('btn-submit-challenge');
        if (!input || !msg || !btn) return;

        if (!input.files || !input.files[0]) {
          msg.style.color = '#F87171';
          msg.textContent = 'Please select a file.';
          return;
        }

        const file = input.files[0];
        const fd = new FormData();
        fd.append('challenge_id', challengeId);
        fd.append('file', file);
        const csrf = getCsrfToken();
        if (csrf) fd.append('csrf_token', csrf);

        btn.disabled = true;
        const prevLabel = btn.textContent;
        btn.textContent = 'Submitting...';
        msg.style.color = 'var(--text-secondary)';
        msg.textContent = 'Uploading...';

        try {
          const headers = {};
          if (csrf) headers['X-CSRF-Token'] = csrf;
          const res = await fetch('/api/challenges/submit.php', {
            method: 'POST',
            body: fd,
            credentials: 'same-origin',
            headers
          });
          let json = null;
          try {
            json = await res.json();
          } catch (_) {
            json = null;
          }
          if (res.status === 401) {
            throw new Error('Session expired. Please sign in again.');
          }
          if (!res.ok || !json || !json.success) {
            throw new Error((json && (json.message || json.error)) || 'Upload failed');
          }
          msg.style.color = '#10B981';
          msg.textContent = (json.data && json.data.message) || 'Submission received.';
          // Reload detail only (not recursive list→detail loop)
          detailLoading = false;
          await openChallenge(challengeId);
        } catch (e) {
          msg.style.color = '#F87171';
          msg.textContent = e.message || 'Upload failed';
          btn.disabled = false;
          btn.textContent = prevLabel;
        }
      }

      // Expose for any residual inline handlers (none expected after rewrite)
      window.openChallenge = openChallenge;
      window.submitChallenge = submitChallenge;
      window.loadChallenges = loadChallenges;

      document.addEventListener('DOMContentLoaded', async () => {
        if (pageInitialized) return;
        pageInitialized = true;

        // Same auth pattern as other student pages (requireRole did not exist → auth was skipped)
        if (window.session && typeof window.session.requireAuth === 'function') {
          const user = await window.session.requireAuth(['student']);
          if (!user) return; // requireAuth redirects
        }

        if (window.renderSidebar) window.renderSidebar('challenges');
        if (window.renderHeader) window.renderHeader('Challenges', 'Mission-style coding challenges');

        document.querySelectorAll('.filter-chip').forEach(btn => {
          btn.addEventListener('click', () => {
            document.querySelectorAll('.filter-chip').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentFilter = btn.dataset.filter;
            selectedId = null;
            document.getElementById('detail-root').style.display = 'none';
            loadChallenges();
          });
        });

        // Single controlled initial load
        await loadChallenges();
        if (window.lucide) lucide.createIcons();
      });
    })();
  </script>
</body>
</html>
