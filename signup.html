<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration - SPS Code Orbit</title>
  <link rel="stylesheet" href="css/global.css?v=2.0">
  <link rel="stylesheet" href="css/components.css?v=2.0">
  <link rel="stylesheet" href="css/responsive.css?v=1.2">
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="/css/ux-polish.css?v=1.0">
</head>
<body style="background: #070A14; min-height: 100vh; display: flex; flex-direction: column;">

  <!-- ========================================================================
       0. IMMERSIVE DEEP-SPACE UNIVERSE & SWIRLING NEBULAE BACKDROP
       ======================================================================== -->
  <div class="space-universe-backdrop" aria-hidden="true">
    <div class="starfield-layer"></div>
    <div class="starfield-layer-dense"></div>
    <div class="nebula-swirl-container">
      <div class="nebula-cloud nebula-blue"></div>
      <div class="nebula-cloud nebula-purple"></div>
      <div class="nebula-cloud nebula-pink"></div>
      <div class="nebula-cloud nebula-cyan-lower"></div>
    </div>
  </div>

  <!-- Header -->
  <header class="auth-page-header" style="background: #070A14; border-bottom: 1px solid rgba(255, 255, 255, 0.08); padding: 0.85rem 1.25rem; display: flex; justify-content: space-between; align-items: center; position: relative; z-index: 10;">
    <a href="/index.html" class="landing-logo" style="text-decoration: none; display: flex; align-items: center; gap: 0.75rem; color: #FFFFFF; font-weight: 800;">
      <div class="landing-logo-icon" style="color: #70D6FF; filter: drop-shadow(0 0 8px rgba(112, 214, 255, 0.5));">
        <i data-lucide="orbit" style="width: 26px; height: 26px;"></i>
      </div>
      <span>SPS Code Orbit</span>
    </a>
    <a href="/login.html" class="btn btn-pill" style="border: 1px solid rgba(255, 255, 255, 0.15); background: rgba(255, 255, 255, 0.05); color: #FFFFFF; border-radius: 50px; font-size: 0.85rem; font-weight: 700; padding: 0.5rem 1rem;">Log In</a>
  </header>

  <!-- Form Container -->
  <div style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 2.5rem 1.5rem; position: relative; z-index: 10;">
    <div class="glass-card auth-page-card" style="max-width: 520px; width: 100%; padding: 2.5rem; border-radius: 22px; background: rgba(16, 23, 42, 0.65); border: 1px solid rgba(255, 255, 255, 0.1);">
      
      <div style="text-align: center; margin-bottom: 1.75rem;">
        <div style="width: 56px; height: 56px; border-radius: 50%; background: rgba(112, 214, 255, 0.12); color: #70D6FF; border: 1px solid rgba(112, 214, 255, 0.4); box-shadow: 0 0 20px rgba(112, 214, 255, 0.25); display: inline-flex; align-items: center; justify-content: center; margin-bottom: 1rem;">
          <i data-lucide="user-plus" style="width: 26px; height: 26px;"></i>
        </div>
        <h1 class="text-gradient-cyan" style="font-size: 1.65rem; font-weight: 800; margin-bottom: 0.35rem;">Join SPS Code Orbit</h1>
        <p style="font-size: 0.9rem; color: #94A3B8;">Create your student profile and begin your journey.</p>
      </div>

      <form id="signup-form" onsubmit="handleSignupSubmit(event)" style="display: flex; flex-direction: column; gap: 1.1rem;">
        <div>
          <label style="display: block; font-size: 0.85rem; font-weight: 600; color: var(--text-main); margin-bottom: 0.35rem;">Full Name</label>
          <input type="text" id="reg-fullname" class="input-field" placeholder="e.g. Alex Rivera" style="width: 100%; padding: 0.75rem 1rem; border-radius: 12px; background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.1); color: #FFFFFF;" required>
        </div>

        <div>
          <label style="display: block; font-size: 0.85rem; font-weight: 600; color: var(--text-main); margin-bottom: 0.35rem;">Username</label>
          <input type="text" id="reg-username" class="input-field" placeholder="Choose a unique username" style="width: 100%; padding: 0.75rem 1rem; border-radius: 12px; background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.1); color: #FFFFFF;" required>
        </div>

        <div>
          <label style="display: block; font-size: 0.85rem; font-weight: 600; color: var(--text-main); margin-bottom: 0.35rem;">Academic Stage</label>
          <select id="reg-academic-stage" class="input-field" onchange="handleStageChange()" style="width: 100%; padding: 0.75rem 1rem; border-radius: 12px; background: rgba(16, 23, 42, 0.95); border: 1px solid rgba(255, 255, 255, 0.1); color: #FFFFFF;" required>
            <option value="">Select Academic Stage</option>
            <option value="Primary">Primary (ابتدائي)</option>
            <option value="Prep">Prep (إعدادي)</option>
            <option value="Secondary">Secondary (ثانوي)</option>
          </select>
        </div>

        <div>
          <label style="display: block; font-size: 0.85rem; font-weight: 600; color: var(--text-main); margin-bottom: 0.35rem;">Grade Level (الصف الدراسي)</label>
          <select id="reg-grade-level" class="input-field" style="width: 100%; padding: 0.75rem 1rem; border-radius: 12px; background: rgba(16, 23, 42, 0.95); border: 1px solid rgba(255, 255, 255, 0.1); color: #FFFFFF;" required disabled>
            <option value="">Select Academic Stage first</option>
          </select>
        </div>

        <div>
          <label style="display: block; font-size: 0.85rem; font-weight: 600; color: var(--text-main); margin-bottom: 0.35rem;">Class</label>
          <select id="reg-class" class="input-field" style="width: 100%; padding: 0.75rem 1rem; border-radius: 12px; background: rgba(16, 23, 42, 0.95); border: 1px solid rgba(255, 255, 255, 0.1); color: #FFFFFF;" required disabled>
            <option value="">Select Academic Stage first</option>
          </select>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
          <div>
            <label style="display: block; font-size: 0.85rem; font-weight: 600; color: var(--text-main); margin-bottom: 0.35rem;">Password</label>
            <input type="password" id="reg-password" class="input-field" placeholder="••••••••" style="width: 100%; padding: 0.75rem 1rem; border-radius: 12px; background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.1); color: #FFFFFF;" required>
          </div>
          <div>
            <label style="display: block; font-size: 0.85rem; font-weight: 600; color: var(--text-main); margin-bottom: 0.35rem;">Confirm Password</label>
            <input type="password" id="reg-confirm-password" class="input-field" placeholder="••••••••" style="width: 100%; padding: 0.75rem 1rem; border-radius: 12px; background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.1); color: #FFFFFF;" required>
          </div>
        </div>

        <div id="signup-error-alert" style="display: none; padding: 0.75rem 1rem; background: rgba(244, 63, 94, 0.15); border: 1px solid rgba(244, 63, 94, 0.4); color: #FDA4AF; border-radius: 12px; font-size: 0.85rem;"></div>

        <button type="submit" class="btn btn-primary btn-pill" style="width: 100%; margin-top: 0.5rem; padding: 0.8rem 1.8rem; border-radius: 50px; border: 1px solid rgba(255, 255, 255, 0.4);" id="btn-submit-signup">
          <span>Create Account &amp; Start</span>
          <i data-lucide="arrow-right" style="width: 18px; height: 18px;"></i>
        </button>
      </form>
    </div>
  </div>

  <script src="/js/session.js"></script>
  <script src="/js/i18n.js?v=1.0"></script>
  <script src="/js/theme.js"></script>
  <script>
    const CLASS_OPTIONS = ['A', 'B', 'C', 'A2', 'D', 'E', 'E2'];

    document.addEventListener('DOMContentLoaded', async () => {
      if (window.lucide) window.lucide.createIcons();
      await window.session.requireGuest();
      handleStageChange();
    });

    const GRADE_OPTIONS = {
      Primary: [
        { value: '1 Prim', label: '1st Primary (الصف الأول الابتدائي)' },
        { value: '2 Prim', label: '2nd Primary (الصف الثاني الابتدائي)' },
        { value: '3 Prim', label: '3rd Primary (الصف الثالث الابتدائي)' },
        { value: '4 Prim', label: '4th Primary (الصف الرابع الابتدائي)' },
        { value: '5 Prim', label: '5th Primary (الصف الخامس الابتدائي)' },
        { value: '6 Prim', label: '6th Primary (الصف السادس الابتدائي)' }
      ],
      Prep: [
        { value: '1 Prep', label: '1st Preparatory (الصف الأول الإعدادي)' },
        { value: '2 Prep', label: '2nd Preparatory (الصف الثاني الإعدادي)' },
        { value: '3 Prep', label: '3rd Preparatory (الصف الثالث الإعدادي)' }
      ],
      Secondary: [
        { value: '1 Sec', label: '1st Secondary (الصف الأول الثانوي)' },
        { value: '2 Sec', label: '2nd Secondary (الصف الثاني الثانوي)' },
        { value: '3 Sec', label: '3rd Secondary (الصف الثالث الثانوي)' }
      ]
    };

    if (GRADE_OPTIONS.Prep) GRADE_OPTIONS.Preparatory = GRADE_OPTIONS.Prep;

    function handleStageChange() {
      const stageSelect = document.getElementById('reg-academic-stage');
      const classSelect = document.getElementById('reg-class');
      const gradeSelect = document.getElementById('reg-grade-level');
      const stage = stageSelect.value;
      if (!stage) {
        classSelect.disabled = true;
        classSelect.innerHTML = '<option value="">Select Academic Stage first</option>';
        if (gradeSelect) {
          gradeSelect.disabled = true;
          gradeSelect.innerHTML = '<option value="">Select Academic Stage first</option>';
        }
        return;
      }
      classSelect.disabled = false;
      classSelect.innerHTML = '<option value="">Select Class</option>' +
        CLASS_OPTIONS.map(c => `<option value="${c}">${c}</option>`).join('');
      if (gradeSelect) {
        const grades = GRADE_OPTIONS[stage] || GRADE_OPTIONS['Prep'] || [];
        gradeSelect.disabled = false;
        gradeSelect.innerHTML = '<option value="">Select Grade Level</option>' +
          grades.map(g => `<option value="${g.value}">${g.label}</option>`).join('');
      }
    }

    async function handleSignupSubmit(e) {
      e.preventDefault();
      const full_name = document.getElementById('reg-fullname').value.trim();
      const username = document.getElementById('reg-username').value.trim();
      const academic_stage = document.getElementById('reg-academic-stage').value;
      const grade_level = document.getElementById('reg-grade-level').value;
      const class_section = document.getElementById('reg-class').value;
      const password = document.getElementById('reg-password').value;
      const password_confirm = document.getElementById('reg-confirm-password').value;

      const alertBox = document.getElementById('signup-error-alert');
      alertBox.style.display = 'none';

      if (!academic_stage) {
        showError('Please select your Academic Stage');
        return;
      }
      if (!class_section) {
        showError('Please select your Class');
        return;
      }
      if (password !== password_confirm) {
        showError('Passwords do not match');
        return;
      }

      const btn = document.getElementById('btn-submit-signup');
      btn.disabled = true;
      btn.querySelector('span').textContent = 'Creating account...';

      try {
        const res = await fetch('/api/auth/signup.php', {
          method: 'POST',
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            full_name,
            username,
            password,
            password_confirm,
            academic_stage,
            grade_level,
            academic_year: grade_level,
            class: class_section,
            class_section
          })
        });
        const data = await res.json();
        if (data.success && data.data && data.data.user) {
          window.session.user = data.data.user;
          if (data.data.csrf_token) {
            window.session.csrfToken = data.data.csrf_token;
          }
          window.session.redirectByRole(data.data.user.role || 'student');
        } else {
          showError(data.error || data.message || 'Signup failed. Please try again.');
          btn.disabled = false;
          btn.querySelector('span').textContent = 'Create Account & Start';
        }
      } catch (err) {
        showError('Network error connecting to the server. Please try again.');
        btn.disabled = false;
        btn.querySelector('span').textContent = 'Create Account & Start';
      }
    }

    function showError(msg) {
      const alertBox = document.getElementById('signup-error-alert');
      alertBox.textContent = msg;
      alertBox.style.display = 'block';
    }
  </script>
</body>
</html>
